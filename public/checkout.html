<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary-color: #6C2A2A;
      --font-family: 'Arial', sans-serif;
    }
    body { font-family: var(--font-family); }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .text-primary { color: var(--primary-color); }
    .border-primary { border-color: var(--primary-color); }
  </style>
</head>
<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-[#6C2A2A] text-white text-sm py-2 px-4">
    <div class="container mx-auto flex justify-between items-center">
      <!-- Left links -->
      <div class="flex items-center space-x-4 text-xs">
        <a href="#" class="hover:underline">Mulai Berjualan</a>
        <a href="#" class="hover:underline">Download</a>
        <a href="#" class="hover:underline">Seller Center</a>
      </div>
      <!-- Search -->
      <div class="flex items-center w-full max-w-md mx-6">
        <input type="text" placeholder="Cari produk..."
               class="w-full rounded-l-full py-1.5 px-4 text-black text-sm focus:outline-none" />
        <button class="bg-white px-3 rounded-r-full flex items-center justify-center">
          <img src="../asset/search.png" alt="Search" class="w-8 h-8" />
        </button>
        <button class="ml-4">
          <img src="../asset/shopping-cart (1).png" alt="Cart" class="w-6 h-6" />
        </button>
      </div>
      <!-- Right links -->
      <div class="flex items-center space-x-4 text-sm">
        <a href="setting.html"><img src="../asset/setting.png" alt="Setting" class="w-8 h-8"></a>
        <a href="profile.html"><img src="../asset/profile.png" alt="Profile" class="w-8 h-8"></a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Shipping & Delivery Form -->
      <div class="lg:col-span-7 bg-white p-6 rounded-lg shadow">
        <h2 class="text-2xl font-semibold mb-6 text-[#6C2A2A]">1. Shipping & Delivery</h2>
        <form id="checkout-form" class="space-y-4">
          <!-- Nama Depan & Belakang -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="firstName" class="block text-gray-700 mb-1">First Name*</label>
              <input type="text" id="firstName" name="firstName" 
                     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#6C2A2A]" />
            </div>
            <div>
              <label for="lastName" class="block text-gray-700 mb-1">Last Name*</label>
              <input type="text" id="lastName" name="lastName" 
                     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#6C2A2A]" />
            </div>
          </div>
          <!-- Address Line 1 -->
          <div>
            <label for="address1" class="block text-gray-700 mb-1">Address Line 1*</label>
            <input type="text" id="address1" name="address1" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#6C2A2A]" />
          </div>
          <!-- City & Zip -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="city" class="block text-gray-700 mb-1">City*</label>
              <input type="text" id="city" name="city" 
                     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#6C2A2A]" />
            </div>
            <div>
              <label for="zipCode" class="block text-gray-700 mb-1">Zip Code*</label>
              <input type="text" id="zipCode" name="zipCode" 
                     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#6C2A2A]" />
            </div>
          </div>
          <!-- Province -->
          <div>
            <label for="province" class="block text-gray-700 mb-1">Province*</label>
            <input type="text" id="province" name="province" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#6C2A2A]" />
          </div>
          <!-- Country & Phone -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="countryCode" class="block text-gray-700 mb-1">Country Code*</label>
              <select id="countryCode" name="countryCode" 
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#6C2A2A]">
                <option value="+62">+62</option>
                <option value="+1">+1</option>
                <option value="+44">+44</option>
              </select>
            </div>
            <div>
              <label for="phone" class="block text-gray-700 mb-1">Phone*</label>
              <input type="tel" id="phone" name="phone" 
                     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#6C2A2A]" />
            </div>
          </div>
          <!-- Email -->
          <div>
            <label for="email" class="block text-gray-700 mb-1">Email*</label>
            <input type="email" id="email" name="email" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#6C2A2A]" />
          </div>
        </form>
      </div>

      <!-- Order Summary -->
      <div class="lg:col-span-5">
        <div class="bg-white p-6 rounded-lg shadow">
          <h3 class="text-xl font-semibold mb-4 text-[#6C2A2A]">Order Summary</h3>
          <hr class="my-2 border-gray-300">
          <div class="space-y-2">
            <div class="flex justify-between">
              <span>Item Subtotal (<span id="item-count">0</span>)</span>
              <span id="subtotal" class="text-[#6C2A2A]">Rp0</span>
            </div>
            <div class="flex justify-between text-gray-600">
              <span>Discount Applied</span>
              <span id="discount">- Rp15</span>
            </div>
            <div class="flex justify-between text-gray-600">
              <span>Estimated Tax</span>
              <span id="estimated-tax">Rp0</span>
            </div>
            <hr class="my-2 border-gray-300">
            <div class="flex justify-between font-bold text-lg">
              <span>Order Total</span>
              <span id="order-total" class="text-[#6C2A2A]">Rp0</span>
            </div>
          </div>

          <!-- Promo Code -->
          <div class="mt-4">
            <div class="flex justify-between items-center cursor-pointer" onclick="togglePromo()">
              <span class="font-medium text-[#6C2A2A]">Got A Promo Code?</span>
              <svg id="promo-arrow" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 transition-transform" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </div>
            <div class="mt-2 hidden" id="promo-input">
              <input type="text" placeholder="Enter promo code"
                     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#6C2A2A]" />
              <button class="w-full mt-2 btn-primary py-2 rounded">Apply</button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" form="checkout-form"
                  class="w-full mt-8 btn-primary py-3 rounded transition hover:opacity-90">
            Save and Continue
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Script -->
  <script src="checkout.js"></script>
  <script>
    function togglePromo() {
      const promoInput = document.getElementById('promo-input');
      const arrow      = document.getElementById('promo-arrow');
      promoInput.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    }
  </script>
</body>
</html>
