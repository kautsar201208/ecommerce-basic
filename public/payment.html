<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment</title>

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="../dist/output.css"/>

  <!-- Font Awesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>  

  <!-- Warna utama sesuai cart.html -->
  <style>
    :root {
      --primary-color: #6C2A2A;
      --font-family: 'Arial', sans-serif;
    }
    body {
      font-family: var(--font-family);
    }
    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }
    .text-primary {
      color: var(--primary-color);
    }
    .border-primary {
      border-color: var(--primary-color);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-[#6C2A2A] text-white text-sm py-2 px-4">
    <div class="container mx-auto flex justify-between items-center h-16">
      <!-- Left links -->
      <div class="flex items-center space-x-2 text-xs">
        <a href="#" class="hover:underline">mulai berjualan</a>
        <span>|</span>
        <a href="#" class="hover:underline">Download</a>
        <span>|</span>
        <a href="#" class="hover:underline">Seller Center</a>
      </div>

      <!-- Search section -->
      <div class="flex items-center w-full max-w-md mx-6 bg">
        <input type="text" placeholder="cari"
               class="w-full rounded-l-full py-1.5 px-4 text-black text-sm focus:outline-none bg-white" />
        <button class="bg-white px-3 rounded-r-full flex items-center justify-center">
          <img src="../asset/search.png" alt="Search" class="w-10 h-8 border-l-black border-l-2" />
        </button>
        <button class="ml-4">
          <img src="../asset/shopping-cart (1).png" alt="Cart" class="w-8 h-8" />
        </button>
      </div>

      <!-- Right links -->
      <div class="flex space-x-2 text-sm gap-5">
        <a href="setting">
          <img src="../asset/setting.png" class="w-10 h-10">
        </a>
        <a href="profile">
          <img src="../asset/profile.png" class="w-10 h-10">
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold mb-8 text-gray-900">Checkout</h1>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Checkout Form -->
      <div class="lg:col-span-2 bg-white rounded-lg shadow-md p-6">
        <!-- Shipping Details -->
        <div class="mb-8">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">Shipping Details</h2>
          <div class="grid grid-cols-1 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
              <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#6C2A2A]">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Address Line 1</label>
              <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#6C2A2A]">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Address Line 2 (Optional)</label>
              <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#6C2A2A]">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
                <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#6C2A2A]">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">State/Province</label>
                <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#6C2A2A]">
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Postal Code</label>
                <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#6C2A2A]">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="tel" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#6C2A2A]">
              </div>
            </div>
          </div>
        </div>

        <!-- Payment Method -->
        <div class="mb-8">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">Payment Method</h2>
          <div id="payment-methods" class="space-y-2">
            <label class="flex items-center p-3 border border-gray-300 rounded-md cursor-pointer hover:border-[#6C2A2A]">
              <input type="radio" name="payment" value="standard" class="mr-2 text-[#6C2A2A]">
              <span>Credit/Debit Card</span>
            </label>
            <label class="flex items-center p-3 border border-gray-300 rounded-md cursor-pointer hover:border-[#6C2A2A]">
              <input type="radio" name="payment" value="second-day" class="mr-2 text-[#6C2A2A]">
              <span>Bank Transfer</span>
            </label>
            <label class="flex items-center p-3 border border-gray-300 rounded-md cursor-pointer hover:border-[#6C2A2A]">
              <input type="radio" name="payment" value="ewallet" class="mr-2 text-[#6C2A2A]">
              <span>E-Wallet</span>
            </label>
            <label class="flex items-center p-3 border border-gray-300 rounded-md cursor-pointer hover:border-[#6C2A2A]">
              <input type="radio" name="payment" value="cod" class="mr-2 text-[#6C2A2A]">
              <span>Cash on Delivery</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="bg-white rounded-lg shadow-md p-6 sticky top-24">
        <h2 class="text-xl font-semibold mb-4 text-gray-800">Order Summary</h2>

        <!-- Diskon -->
        <div class="mb-6">
          <button id="discount-button" class="w-full bg-gray-100 text-gray-700 py-2 px-4 rounded-md flex justify-between items-center mb-2">
            <span>Select Discount</span>
            <svg id="discount-arrow" class="w-4 h-4 transform transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div id="discount-options" class="hidden bg-gray-50 p-4 rounded-md">
            <select id="discount-select" class="w-full px-3 py-2 border border-gray-300 rounded">
              <option value="0">Tidak ada diskon</option>
              <option value="5">5% Off - Promo Code: WELCOME5</option>
              <option value="10">10% Off - Promo Code: BIGSALE</option>
              <option value="15">15% Off - Promo Code: HOLIDAY15</option>
            </select>
          </div>
        </div>

        <!-- Daftar item & subtotal -->
        <div id="order-summary" class="space-y-4 mb-6">
          <!-- Diisi oleh JavaScript -->
        </div>

        <!-- Total -->
        <div class="border-t pt-4 mt-4">
          <div class="flex justify-between mb-2">
            <span class="text-gray-600">Discount</span>
            <span id="discount-amount">Rp0,00</span>
          </div>
          <div class="flex justify-between text-lg font-semibold">
            <span>Total</span>
            <span id="total-amount" class="text-[#6C2A2A]">Rp0,00</span>
          </div>
        </div>

        <!-- Tombol Bayar -->
        <button id="complete-payment" class="mt-6 w-full bg-[#6C2A2A] hover:bg-[#5a2020] text-white py-3 rounded-md transition-colors">
          Complete Order
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t">
    <div class="max-w-4xl mx-auto py-6 px-4 flex flex-col sm:flex-row justify-between items-center">
      <p class="text-sm text-gray-600">&copy; 2025 Shoes. All rights reserved.</p>
      <div class="flex space-x-4 mt-4 sm:mt-0">
        <a href="#" class="text-sm text-gray-600 hover:text-[#6C2A2A]">Privacy Policy</a>
        <a href="#" class="text-sm text-gray-600 hover:text-[#6C2A2A]">Terms of Service</a>
        <a href="#" class="text-sm text-gray-600 hover:text-[#6C2A2A]">Contact Us</a>
      </div>
    </div>
  </footer>

  <!-- Script External -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>   
  <script src="payment.js"></script>
  <script>
    // Fungsi Toggle Diskon
    document.getElementById('discount-button').addEventListener('click', () => {
      const options = document.getElementById('discount-options');
      const arrow = document.getElementById('discount-arrow');
      options.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    });
  </script>
</body>
</html>
